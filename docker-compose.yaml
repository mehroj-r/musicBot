services:
  music-bot:
    build: .
    container_name: music-bot-prod
    restart: unless-stopped
    env_file: .env
    volumes:
      # SQLite database and Telethon session
      - bot-data:/app/data
      # cookies.txt for YouTube, kept out of the image
      - ./secrets:/app/secrets:ro
    depends_on:
      telegram-bot-api:
        condition: service_started
        required: false
    logging: &logging
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  # Optional self-hosted Bot API server for uploads up to 2000 MB.
  # Enable with COMPOSE_PROFILES=local-bot-api and LOCAL_BOT_API_URL in .env (see README).
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    container_name: music-bot-api-prod
    profiles: [local-bot-api]
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${API_ID:-}
      TELEGRAM_API_HASH: ${API_HASH:-}
      TELEGRAM_LOCAL: "1"
    volumes:
      - bot-api-data:/var/lib/telegram-bot-api
    logging: *logging

volumes:
  bot-data:
  bot-api-data:
