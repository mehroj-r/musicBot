[project]
name = "musicbot"
version = "0.2.0"
description = "Self-hosted Telegram bot that turns YouTube, YouTube Music, Yandex Music, SoundCloud and other links into tagged M4A/MP3 files, sent to your chat or channel."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mehroj Majidov" }]
keywords = ["telegram", "bot", "aiogram", "music", "audio", "yt-dlp", "youtube", "yandex-music"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Framework :: AsyncIO",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Chat",
    "Topic :: Multimedia :: Sound/Audio",
]
requires-python = ">=3.13"
dependencies = [
    "aiogram>=3.31.0",
    "aiosqlite>=0.22.1",
    "alembic>=1.20.0",
    "cryptg>=0.6.0",
    "mutagen>=1.48.1",
    "pillow>=12.3.0",
    "pydantic-settings>=2.16.0",
    "sqlalchemy[asyncio]>=2.1.4",
    "telethon>=1.45.0",
    "yt-dlp[default]>=2026.8.19",
]

[project.urls]
Homepage = "https://t.me/MusicAsistentRoBot"
Repository = "https://github.com/mehroj-r/music-bot"
Issues = "https://github.com/mehroj-r/music-bot/issues"

[project.scripts]
musicbot = "musicbot.__main__:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
