name: Update yt-dlp

on:
  schedule:
    - cron: "0 0 * * *" # Daily at midnight UTC
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      # Push with the PAT: pushes made with GITHUB_TOKEN don't trigger CI, and CI triggers the deploy
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.PAT }}

      - uses: astral-sh/setup-uv@v10

      - name: Upgrade yt-dlp
        id: upgrade
        run: |
          uv lock --upgrade-package yt-dlp --upgrade-package yt-dlp-ejs
          if git diff --quiet uv.lock; then
            echo "yt-dlp is already up to date." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "version=$(uv tree --frozen --package yt-dlp --depth 0 | awk 'NR==1 {print $2}')" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.upgrade.outputs.version
        env:
          VERSION: ${{ steps.upgrade.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: update yt-dlp to $VERSION"
          git push
          echo "Updated yt-dlp to $VERSION; CI and the deploy run next." >> "$GITHUB_STEP_SUMMARY"
