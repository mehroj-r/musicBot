name: Update yt-dlp

on:
  schedule:
    - cron: "0 0 * * *" # Daily at midnight UTC
  workflow_dispatch:

permissions:
  # Push the update branch, open and merge its pull request, then start CI
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: update-yt-dlp
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BRANCH: chore/update-yt-dlp
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      # yt-dlp pins its yt-dlp-ejs version, so a new yt-dlp release is all there is to watch.
      # PyPI rather than GitHub releases: uv installs from PyPI, which can lag the GitHub tag
      - name: Check for a new release
        id: check
        run: |
          locked=$(python3 -c 'import tomllib
          lock = tomllib.load(open("uv.lock", "rb"))
          print(next(p["version"] for p in lock["package"] if p["name"] == "yt-dlp"))')
          latest=$(curl -fsS --retry 3 https://pypi.org/pypi/yt-dlp/json | jq -r .info.version)
          echo "yt-dlp: $locked locked, $latest is the latest release." >> "$GITHUB_STEP_SUMMARY"
          if [ "$(printf '%s\n' "$locked" "$latest" | sort -V | tail -n 1)" != "$locked" ]; then
            echo "version=$latest" >> "$GITHUB_OUTPUT"
          fi

      - uses: astral-sh/setup-uv@v10.3.0
        if: steps.check.outputs.version

      - name: Lock the new release
        if: steps.check.outputs.version
        env:
          VERSION: ${{ steps.check.outputs.version }}
        run: uv lock --upgrade-package "yt-dlp==$VERSION"

      # master only takes pull requests that passed CI, so the update goes through one too
      - name: Open a pull request
        if: steps.check.outputs.version
        env:
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git commit -am "chore: update yt-dlp to $VERSION"
          # Replaces the branch of an earlier update that didn't get merged
          git push --force origin "$BRANCH"

          title="chore: update yt-dlp to $VERSION"
          pr=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')
          if [ -n "$pr" ]; then
            gh pr edit "$pr" --title "$title"
          else
            gh pr create --base "$GITHUB_REF_NAME" --head "$BRANCH" --title "$title" \
              --body "Locks [yt-dlp $VERSION](https://github.com/yt-dlp/yt-dlp/releases/tag/$VERSION). Opened and merged by the Update yt-dlp workflow once CI passes."
          fi

      # Pull requests opened with GITHUB_TOKEN don't trigger workflows, but dispatching one does.
      # Its checks run on the pull request's head commit, so they count for the pull request
      - name: Run CI on the pull request
        if: steps.check.outputs.version
        run: |
          sha=$(git rev-parse HEAD)
          gh workflow run ci.yml --ref "$BRANCH"
          # The dispatched run takes a few seconds to show up
          for _ in $(seq 24); do
            run=$(gh run list --workflow ci.yml --event workflow_dispatch --commit "$sha" \
              --json databaseId --jq '.[0].databaseId')
            [ -n "$run" ] && break
            sleep 5
          done
          if [ -z "$run" ]; then
            echo "CI didn't start on $sha." >&2
            exit 1
          fi
          gh run watch "$run" --exit-status

      - name: Merge
        if: steps.check.outputs.version
        run: gh pr merge "$BRANCH" --squash --match-head-commit "$(git rev-parse HEAD)"

      # The merge, made with GITHUB_TOKEN, doesn't trigger CI on master either;
      # CI passing on master then triggers the deploy
      - name: Run CI on the merge
        if: steps.check.outputs.version
        env:
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          gh workflow run ci.yml --ref "$GITHUB_REF_NAME"
          echo "Updated yt-dlp to $VERSION; CI and the deploy run next." >> "$GITHUB_STEP_SUMMARY"
