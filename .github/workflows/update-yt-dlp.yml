name: Update yt-dlp

on:
  schedule:
    - cron: "0 0 * * *" # Daily at midnight UTC
  workflow_dispatch:

permissions:
  # Push the updated lock file, then start CI on it
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0

      - name: Upgrade yt-dlp
        id: upgrade
        run: |
          uv lock --upgrade-package yt-dlp --upgrade-package yt-dlp-ejs
          if git diff --quiet uv.lock; then
            echo "yt-dlp is already up to date." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "version=$(uv tree --frozen --package yt-dlp --depth 0 | awk 'NR==1 {print $2}')" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.upgrade.outputs.version
        env:
          VERSION: ${{ steps.upgrade.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: update yt-dlp to $VERSION"
          git push

      # Pushes made with GITHUB_TOKEN don't trigger workflows, but dispatching one does;
      # CI passing on master then triggers the deploy
      - name: Run CI on the update
        if: steps.upgrade.outputs.version
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.upgrade.outputs.version }}
        run: |
          gh workflow run ci.yml --ref "$GITHUB_REF_NAME"
          echo "Updated yt-dlp to $VERSION; CI and the deploy run next." >> "$GITHUB_STEP_SUMMARY"
